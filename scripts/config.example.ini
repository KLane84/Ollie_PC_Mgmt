; Copy to config.local.ini (same folder as the .ahk script) and adjust.
; config.local.ini is gitignored.

[FamilySafety]
; Case-insensitive regex against the *top-level* window title.
; Broad default for English "minutes" style warnings — tighten after you capture the real title.
TitleRegex=.*\d+\s+minute.*

; Optional: require window class (leave empty to skip). Example: #32770
WindowClass=

; Optional: require executable name (leave empty to skip). Example: wpcmon.exe
ExeName=

; Comma-separated list of substrings; the script picks a control whose text contains ALL of them (case-insensitive).
; Default targets "Request more time" style labels.
RequestButtonSubstrings=Request,more

; Optional second click: some flows use a second dialog; same substring rules.
; Leave empty to skip second pass.
ConfirmButtonSubstrings=

; Ignore duplicate handling within this many seconds (avoids spamming Microsoft + Discord).
DebounceSeconds=90

; Full Discord incoming webhook URL, OR leave empty and set environment variable FAMILY_SAFETY_DISCORD_WEBHOOK for the child session.
DiscordWebhook=

; Log file path (folder must be writable by Oliver). Empty = %TEMP%\FamilySafetyRequestMoreTime.log
LogPath=

; If 1, only log what would match — do not click (for testing).
DryRun=0
